# Firebase App Hosting / Cloud Run configuration for Darkgrid RPG
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 1
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: DB_PATH
    value: /tmp/darkgrid.sqlite
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    value: b89c7f6241e305a89d142763c5e08f1249a3b7d65e1f809234a6c1d8e7b5029f
    availability:
      - RUNTIME
