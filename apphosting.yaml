# Firebase App Hosting / Cloud Run configuration for Darkgrid RPG (Blaze Plan)
# Enforces strict cost caps (minInstances: 0, maxInstances: 1, 1 vCPU, 512 MiB)
# and durable server-side persistence via Cloud Firestore write-through (never /tmp alone).
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 1
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: darkgrid-rpg
    availability:
      - RUNTIME
  - variable: ENABLE_FIRESTORE_SYNC
    value: "true"
    availability:
      - RUNTIME
  - variable: DB_PATH
    value: /tmp/darkgrid.sqlite
    availability:
      - RUNTIME
  - variable: DURABLE_SNAPSHOT_PATH
    value: /tmp/darkgrid-durable-snapshot.json
    availability:
      - RUNTIME
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability:
      - RUNTIME
